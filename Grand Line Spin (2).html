else if(i==0){const s=pick(STATS);bump(s,1);h='Trained hard: <b>+1 '+s+'</b>';const r=Math.random();if(r<.3&&S.sm<4){S.sm++;h+='<br>🥋 '+S.style+' mastery → <b>'+SM[S.sm]+'</b>'}else if(r>.8&&S.fruit!='None'&&S.fm<4){S.fm++;h+='<br>🍎 Fruit mastery → <b>'+FMN[S.fm]+'</b>'}}
else if(i==1){
 if(!HK.some(k=>S.hk[k])){if(Math.random()<.55){const k=pick(HK.slice(0,2));S.hk[k]=1;h='You awakened <b>'+k+' Haki</b>!'}else h='You meditated for months but felt nothing…'}
 else if(!S.hk["Conqueror's"]&&fin('Willpower')>=8&&Math.random()<.2){S.hk["Conqueror's"]=1;h='Your will crushed the room — <b>Conqueror\'s Haki</b> awakens!'}
 else h=hakiUp()||'You have mastered every Haki you own.'}
else if(i==2){const st=S.steps.find(s=>!s.d);if(!st)h='Every procedure is complete.';else if(!st.r()){S.prog+=2;h='🎯 Next procedure: <b>'+st.n+'</b>. You are not there yet — keep growing!'}else if(Math.random()<Math.min(.9,.5+power()/300+S.prog/400)){st.d=true;h='✅ Procedure complete: <b>'+st.n+'</b> ('+S.steps.filter(s=>s.d).length+'/'+S.steps.length+')'}else h='🎯 You attempted <b>'+st.n+'</b> but it fell through. Try again.'}
else if(i==3){const f=foe(),e=f[2]+rnd(-4,6),p=power();h='⚔️ You face <b>'+f[1]+'</b> (power '+f[2]+') — you: '+p+'<br>';
 const gain=()=>{const b=Math.pow(f[2],3)*1500;S.bounty+=b;S.prog+=5;if(!S.beat.includes(f[1]))S.beat.push(f[1]);return'Bounty +'+berry(b)};
 if(Math.random()<p/(p+e)){h+='<b>Victory!</b> '+gain();if(Math.random()<.4){const s=pick(STATS);bump(s,1);h+='<br>💪 Battle growth: +1 '+s}if(Math.random()<.15)h+='<br>🔥 Heat of battle: '+(hakiUp()||'');if(Math.random()<.15&&S.sm<4){S.sm++;h+='<br>🥋 Style mastery → <b>'+SM[S.sm]+'</b>'}}
 else if(Math.random()<.2+fin('Willpower')*.02+(S.hk["Conqueror's"]?.1:0)){const s=pick(STATS);bump(s,2);h+='🔥 <b>SECOND WIND!</b> Near defeat, you push past your limit: +2 '+s+(S.hk.Armament||S.hk.Observation?'<br>'+hakiUp():'')+'<br><b>You turn it around and win!</b> '+gain()}
 else{if(S.allies.length&&Math.random()<.2+.15*S.allies.length){h+='<b>Defeated</b> — but the <b>'+pick(S.allies).n+'</b> arrive and drag you to safety!'}else{h+='<b>Defeated!</b> '+f[1]+' stands over you…';S.foe=f;S.sub=subMercy}}}
else if(i==4){if(S.fruit=='None'&&Math.random()<.2){const t=pick(['Paramecia','Paramecia','Zoan','Logia','Ancient Zoan']);S.fruit=pick(FR[t])+' ('+t+')';S.fm=0;h='🍎 You found and ate the <b>'+S.fruit+'</b>!';S.sub=subFM}else{const s=pick(STATS);bump(s,2);S.prog+=6;h='Epic adventure! <b>+2 '+s+'</b>, dream +6%'}}
else if(i==5){const s=pick(STATS);bump(s,-1);h='🩹 Injury / betrayal: <b>−1 '+s+'</b>'}
else if(i==6){if(Math.random()<.6){const c=addCrew();h=c?'🤝 <b>'+c+'</b> joins your crew! (+4 power)':'Your crew is already full of legends.'}else h='No one worthy wanted to follow you… yet.'}
else if(i==7||i==8){const e=FAC[S.faction][i-7],[l,ok,bad,st,pg,bm,r,rk]=e;
 if(Math.random()<r+fin('Luck')*.01){bump(st,1);S.prog+=pg;const b=bm*1e6*(1+S.yr/3);S.bounty+=b;h=l+': '+ok+'<br>+1 '+st+', dream +'+pg+'%, bounty +'+berry(b);if(rk&&S.rank<6){S.rank++;h+='<br>🎖️ Now a <b>'+RANKS[S.rank]+'</b>'}if(Math.random()<.2){const c=addCrew();if(c)h+='<br>🤝 '+c+' joins you!'}}
 else{h=l+': '+bad;if(Math.random()<.4){bump('Durability',-1);h+=' (−1 Durability)'}}}
else if(i==9)end='🏝️ Retired peacefully';else{h='📜 A promotion review is coming up…';S.sub=subPromo}
if(!end&&S.steps.length&&S.steps.every(s=>s.d))end='🏆 Dream Achieved: '+S.goal+'!';
if(!end&&S.age>=75)end='🌅 Lived to a ripe old age and retired';
S.age+=.5;S.yr+=.5;if(!h&&end)h=end;else if(end)h+='<br>'+end;log(h.replace(/<br>/g,' ').replace(/<[^>]+>/g,''));return{h,end}}
let MU=true,AC=null;
const au=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}return AC};
function tn(f,d,ty,v,dl){if(!MU)return;const a=au();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(dl||0);o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function tickSeq(){au();let t=0,iv=.06;while(t<3.5){setTimeout(()=>tn(900,.04,'square',.05),t*1000);t+=iv;iv*=1.07}}
function sfx(s){if(/Killed|finishes you/.test(s))[196,147,110,82].forEach((f,i)=>tn(f,.5,'sawtooth',.15,i*.3));else if(/Dream Achieved/.test(s))[523,659,784,1047,784,1047,1319].forEach((f,i)=>tn(f,.3,'triangle',.18,i*.14));else if(/Defeated|Arrested|Setback|turned you down|Rejected|fell through|not there yet|refuse|Passed Over|Demoted|felt nothing/.test(s))[330,262,196].forEach((f,i)=>tn(f,.3,'sawtooth',.1,i*.15));else if(/Victory|SECOND WIND|joins|alliance|Warlord|Yonko|Promoted|Promotion|complete|improved|awaken|mastery|Mastery|ate the/.test(s))[523,659,784,1047].forEach((f,i)=>tn(f,.25,'triangle',.16,i*.1));else tn(660,.15,'sine',.12)}
const cv=document.getElementById('cv'),x=cv.getContext('2d'),$=id=>document.getElementById(id);
function draw(items){const T=items.reduce((a,b)=>a+b.w,0);let a=-Math.PI/2;x.clearRect(0,0,640,640);
items.forEach(i=>{const s=i.w/T*Math.PI*2;x.beginPath();x.moveTo(320,320);x.arc(320,320,316,a,a+s);x.fillStyle=i.c;x.fill();x.strokeStyle='#0e1a2b';x.lineWidth=3;x.stroke();
if(s>.3){x.save();x.translate(320,320);x.rotate(a+s/2);x.textAlign='right';x.fillStyle='#10131a';x.font='bold '+(items.length>12?16:items.length>8?20:25)+'px Georgia';x.fillText(i.l.length>17?i.l.slice(0,16)+'…':i.l,298,8);x.restore()}a+=s})}
function showWheel(){cv.style.transition='none';rot=0;cv.style.transform='rotate(0)';cv.offsetWidth;draw(cur);$('sp').disabled=false;$('nx').style.display='none';$('rs').innerHTML='<small>Spin the wheel…</small>'}
function show(){const s=steps[step];$('st').textContent='CHARACTER CREATION · '+(step+1)+' / '+steps.length;$('tt').textContent=s.t;cur=s.w();showWheel()}
function turn(){$('st').textContent='THE JOURNEY · YEAR '+Math.floor(S.yr)+(S.yr%1?' · 2nd half':' · 1st half');$('tt').textContent='Age '+ag()+' — What happens?';cur=lifeWheel();showWheel();status()}
function status(){const s=$('sts');s.style.display='block';s.innerHTML=`<b>${S.faction}</b>${RANKS[S.faction]?' · '+RANKS[S.faction][S.rank]:''}${S.title?' · 👑 '+S.title:''} · Dream: ${S.goal} (${S.steps.filter(s=>s.d).length}/${S.steps.length})<br>Next: ${(S.steps.find(s=>!s.d)||{n:'done'}).n}<br>Bounty: ${berry(S.bounty)} · Power: ${power()}<br>Haki: ${hStr()}<br>Fruit: ${S.fruit}${S.fruit!='None'?' ('+FMN[S.fm]+')':''}<br>Style: ${S.style} (${SM[S.sm]}) · ${S.weapon?S.weapon.n:'—'}<br>Crew (${S.crew.length}): ${S.crew.join(', ')||'none'}<br>Allies: ${S.allies.map(a=>a.n).join(', ')||'none'}<br>`+STATS.map(k=>k.slice(0,3)+' '+fin(k)).join(' · ')}
$('sp').onclick=()=>{if(busy)return;busy=true;$('sp').disabled=true;tickSeq();const T=cur.reduce((a,b)=>a+b.w,0);let r=Math.random()*T,idx=0,st=0;for(;idx<cur.length-1;idx++){if(r<cur[idx].w)break;r-=cur[idx].w;st+=cur[idx].w}
const ang=(st+cur[idx].w*(.15+Math.random()*.7))/T*360;rot=360*6+(360-ang);cv.style.transition='transform 3.6s cubic-bezier(.12,.7,.1,1)';cv.style.transform='rotate('+rot+'deg)';
setTimeout(()=>{busy=false;if(mode=='make'){const o=steps[step].f(cur[idx],idx);$('rs').innerHTML='<b>'+(o||cur[idx].l)+'</b>';$('nx').textContent='Next ▶'}
else if(S.subOn){S.subOn=false;const o=S.sub.fn(cur[idx]);S.sub=null;$('rs').innerHTML=o;log;status();$('nx').textContent=S.end?'See Your Legacy ▶':'Next Year ▶'}else{const r=life(idx,cur[idx].l);if(r.end)S.sub=null;$('rs').innerHTML=r.h;S.end=r.end;status();$('nx').textContent=r.end?'See Your Legacy ▶':S.sub?'Spin: '+S.sub.title+' ▶':'Next Year ▶'}$('nx').style.display='inline-block';sfx($('rs').textContent+' '+(S.end||''))},3800)};
$('nx').onclick=()=>{if(mode=='make'){step++;while(step<steps.length&&steps[step].sk&&steps[step].sk())step++;if(step<steps.length)show();else{mode='life';turn()}}else if(S.sub&&!S.subOn){S.subOn=true;cur=S.sub.items();$('tt').textContent=S.sub.title;showWheel()}else if(S.end)legacy();else turn()};
function legacy(){$('game').style.display='none';$('st').textContent='LEGACY';$('tt').textContent=S.end;
const bars=STATS.map(s=>{const b=fin(s)-S.st[s];return`<div class="row"><span>${s}</span><div class="bar"><i style="width:${Math.min(100,S.st[s]*5)}%;background:#2a9d8f"></i><i style="width:${Math.max(0,Math.min(100,b*5))}%;background:#f5b335"></i></div><span style="width:34px">${fin(s)}</span></div>`}).join('');
$('end').style.display='block';$('end').innerHTML=`<div class="sheet"><p><b>Faction:</b> ${S.faction}${RANKS[S.faction]?' ('+RANKS[S.faction][S.rank]+')':''}</p><p><b>Ended at age:</b> ${Math.floor(S.age-.5)}</p><p><b>Dream:</b> ${S.goal} (${S.steps.filter(s=>s.d).length}/${S.steps.length} procedures)</p><p><b>Bounty:</b> ${berry(S.bounty)}</p><p><b>Devil Fruit:</b> ${S.fruit}${S.fruit!='None'?' ('+FMN[S.fm]+')':''}</p><p><b>Style:</b> ${S.style} (${SM[S.sm]})</p><p><b>Weapon / Technique:</b> ${S.weapon?S.weapon.n:'none'}</p><p><b>Haki:</b> ${hStr()}</p><p><b>Bloodline:</b> ${S.blood}</p><p><b>Title:</b> ${S.title||'none'}</p><p><b>Crew:</b> ${S.crew.join(', ')||'none'}</p><p><b>Allies:</b> ${S.allies.map(a=>a.n).join(', ')||'none'}</p>${bars}</div><div class="sheet"><p><b>Your Life Story</b></p><ul class="log">${S.log.map(l=>'<li>'+l+'</li>').join('')}</ul></div><button onclick="start()">New Character</button>`}
function start(){S={st:{},run:{},hk:{},log:[],crew:[],age:17,yr:1,prog:0,bounty:0,rank:0,fm:0,sm:0,style:'',allies:[],title:'',weapon:null,foe:null,beat:[],steps:[],sub:null,subOn:false,end:null};mode='make';step=0;build();$('end').style.display='none';$('sts').style.display='none';$('game').style.display='block';show()}
start();
</script></body></html>
